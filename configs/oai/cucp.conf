# CNTC RANCert: OAI gNB-CU-CP, three-way split (CU-CP / CU-UP / DU).
#
#   sudo nr-softmodem -O configs/oai/cucp.conf --gNBs.[0].min_rxtxtime 6
#
# min_rxtxtime 6 is required only when the OAI nr-UE is the stimulus (doc/E1AP/E1-design.md).
#
# Derived from ci-scripts/conf_files/gnb-cucp.sa.f1.conf. What changed and why:
#   plmn        208/99 -> 208/93 with sd 0x010203, to match what free5GC is provisioned with
#   amf         the "oai-amf" docker name -> the free5GC AMF N2 service address
#   addresses   the docker bridge -> the same loopback plan the OCUDU rig uses, so one set of
#               capture filters covers both stacks
#
# The security block is left EXACTLY as OAI ships it. Changing it would be configuring the
# product under test to pass a security requirement, which is the one thing a certification
# rig must never do. Whatever it selects is what gets reported.
Active_gNBs = ( "gNB-OAI");
Asn1_verbosity = "none";

gNBs =
(
 {
    gNB_ID = 0xe00;
    gNB_name  =  "gNB-OAI";

    tracking_area_code  =  1;
    plmn_list = ({ mcc = 208; mnc = 93; mnc_length = 2; snssaiList = ({ sst = 1, sd = 0x010203 }) });

    nr_cellid = 12345678L;

    tr_s_preference = "f1";

    local_s_address  = "127.0.10.1";   # F1-C listener (SCTP 38472) for the DU
    remote_s_address = "0.0.0.0";      # any DU
    local_s_portd    = 2152;
    remote_s_portd   = 2152;

    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    amf_ip_address = ({ ipv4 = "10.152.183.216"; });   # free5GC AMF N2, SCTP 38412

    E1_INTERFACE =
    (
      {
        type = "cp";
        ipv4_cucp = "127.0.20.1";      # E1 listener (SCTP 38462) for the CU-UP
        port_cucp = 38462;
        ipv4_cuup = "0.0.0.0";         # any CU-UP
        port_cuup = 38462;
      }
    )

    NETWORK_INTERFACES :
    {
        GNB_IPV4_ADDRESS_FOR_NG_AMF = "192.168.6.90/24";   # the address the AMF sees
    };
  }
);

security = {
  ciphering_algorithms = ( "nea0" );
  integrity_algorithms = ( "nia2", "nia0" );
  drb_ciphering = "yes";
  drb_integrity = "no";
};

log_config :
{
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
  mac_log_level    = "info";
  rlc_log_level    = "info";
  pdcp_log_level   = "info";
  rrc_log_level    = "info";
  f1ap_log_level   = "info";
  ngap_log_level   = "debug";
  sctp_log_level   = "info";
};
