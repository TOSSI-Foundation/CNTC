# CNTC RANCert: OAI gNB-CU-UP.
#
#   sudo nr-cuup -O configs/oai/cuup.conf
#
# Derived from ci-scripts/conf_files/gnb-cuup.sa.f1.conf, re-addressed onto the same
# loopback plan as the CU-CP and the DU. PLMN and slice match what free5GC serves.
# SPDX-License-Identifier: LicenseRef-CSSL-1.0

Active_gNBs = ( "gNB-OAI");
# Asn1_verbosity, choice in: none, info, annoying
Asn1_verbosity = "none";

gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID = 0xe00;
    gNB_CU_UP_ID = 0xe00;

#     cell_type =  "CELL_MACRO_GNB";

    gNB_name  =  "gNB-OAI";

    // Tracking area code, 0x0000 and 0xfffe are reserved values
    tracking_area_code  =  1;
    plmn_list = ({ mcc = 208; mnc = 93; mnc_length = 2; snssaiList = ({ sst = 1, sd = 0x010203 }) });


    tr_s_preference = "f1";

    local_s_address = "127.0.10.1";   # F1-U toward the DU
    remote_s_address = "127.0.10.2";  # the DU
    local_s_portd   = 2152;
    remote_s_portd  = 2152;

    # ------- SCTP definitions
    SCTP :
    {
        # Number of streams to use in input/output
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    E1_INTERFACE =
    (
      {
        type = "up";
        ipv4_cucp = "127.0.20.1";   # the CU-CP E1 listener
        ipv4_cuup = "127.0.20.2";   # this CU-UP on E1
      }
    )

    NETWORK_INTERFACES :
    {
        GNB_IPV4_ADDRESS_FOR_NG_AMF              = "192.168.6.90/24";
        GNB_IPV4_ADDRESS_FOR_NGU                 = "192.168.6.90/24";   # N3 toward the UPF
        GNB_PORT_FOR_S1U                         = 2152; # Spec 2152
    };
  }
);

log_config : {
  global_log_level = "info";
  pdcp_log_level   = "info";
  f1ap_log_level   = "info";
  ngap_log_level   = "info";
};
