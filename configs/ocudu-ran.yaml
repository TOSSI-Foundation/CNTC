# CNTC Stage 3: RAN campaign against an OCUDU split gNB (O-CU-CP / O-CU-UP / O-DU).
#
#   ranbench doctor --config configs/ocudu-ran.yaml
#   ranbench run    --config configs/ocudu-ran.yaml --target cucp
#   ranbench run    --config configs/ocudu-ran.yaml --target all
#   cntc  verdict   campaigns/<id>/results.json --profile cucp-conformance
#
# Addresses and pcap paths are NOT listed here: the adapter reads them live out of the YAML
# each OCUDU process was started with (ran.configs below), so redeploying the RAN needs no
# edits in this file.
domain: ran
campaign: OCUDU-RAN-001
target: all                    # du | cucp | cuup | all

ran:
  adapter: ocudu               # ranbench/adapters/ocudu.py
  bin_dir: ~/ocudu/build/apps  # apps/cu_cp/ocucp, apps/cu_up/ocuup, apps/du/odu
  sudo: true
  # The configuration each product class runs with, the adapter parses these for the live
  # F1-C / E1 / F1-U / N3 addresses and for which per-interface pcaps are enabled.
  configs:
    cucp: configs/ocudu/cu_cp.yml
    cuup: configs/ocudu/cu_up.yml
    du:   configs/ocudu/du_zmq.yml

# The 5G core the RAN peers with (N2 to the AMF, N3 to the UPF). Bring-your-own: it is a peer,
# not the subject of the certificate.
core:
  adapter: free5gc_k8s
  namespace: free5gc
  webui: http://localhost:30500
  # Restart the AMF before each campaign so every run starts from a defined registration
  # state. Set false if you manage core state yourself. See docs/RANBENCH-RIG.md.
  reset_amf: true

# The UE that stimulates the RAN. It is an external process (built by the tester); ranbench
# owns only its invocation. Every parameter here must agree with the DU's cell config, see
# docs/RANBENCH-RIG.md for the eight that matter and what happens when they don't.
drivers:
  ue: ue_oai_zmq
  ue_bin: ~/openairinterface5g/cmake_targets/ran_build/build/nr-uesoftmodem
  uecap_file: ~/openairinterface5g/targets/PROJECTS/GENERIC-NR-5GC/CONF/uecap_ports1.xml
  prb: 51                     # 20 MHz at SCS 30 kHz
  numerology: 1
  band: 78
  centre_freq_hz: 3489420000  # = the DU's dl_arfcn 632628
  ssb: 0                      # the DU reports SSB offset pointA 0 / k_SSB 0
  zmq_tx: tcp://127.0.0.1:4557
  zmq_rx: tcp://127.0.0.1:4556
  attach_timeout_s: 150
  ping_target: 8.8.8.8

# 5G-AKA subscribers to provision into the core (the RAN cannot be exercised without one).
# These MUST match the core's PLMN and the slice the CU-CP advertises at NG Setup, or the UE
# is rejected: free5GC here serves mcc 208 / mnc 93, S-NSSAI sst 1 / sd 010203, DNN internet.
subscribers:
  - supi: "imsi-208930000000001"
    ki: "8baf473f2f8fd09487cccbd7097c6862"
    opc: "8e27b6af0e692e750f32667a3b14605d"
    plmn: "20893"
    sst: 1
    sd: "010203"
    dnn: "internet"

sut:
  rig_class: "shared-vm"
  cpu: ""
  ran_release: ""             # filled live by the adapter from `<binary> --version`
