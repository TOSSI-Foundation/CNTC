# CNTC rig: OCUDU O-CU-CP under test.
#
# N2 goes to the bring-your-own core (free5GC on Kubernetes, AMF exposed as a NodePort/ClusterIP
# SCTP 38412 service); F1-C and E1 listen on host loopback addresses for the O-DU and O-CU-UP.
# The tracking area and slice MUST match what the AMF supports or NG Setup is rejected.
#
#   sudo ~/ocudu/build/apps/cu_cp/ocucp -c configs/ocudu/cu_cp.yml
#
# ranbench reads this file to resolve the CU-CP's endpoints and its enabled pcaps, the pcaps
# below are the evidence for the NGAP / F1AP / E1AP / RRC / AS-security test cases.
cu_cp:
  # The OAI UE takes longer than the 3 s default to send the PDU Session Establishment
  # Request after registration; the CU-CP otherwise releases the UE before it asks
  # ("UE did not request a PDU session after 3000ms"). Seconds, must exceed T310.
  request_pdu_session_timeout: 20
  amf:
    addrs: 10.152.183.216           # free5GC AMF N2 service (ClusterIP, SCTP 38412)
    bind_addrs: 192.168.6.90      # host address the AMF sees as the gNB
    supported_tracking_areas:
      - tac: 1                    # free5GC supportTaiList tac 000001
        plmn_list:
          - plmn: "20893"         # free5GC mcc 208 / mnc 93
            tai_slice_support_list:
              - sst: 1
                sd: 0x010203      # free5GC snssaiList sst 1 / sd 010203
  e1ap:
    bind_addrs: 127.0.20.1        # E1 listener (SCTP 38462) for the O-CU-UP
  f1ap:
    bind_addrs: 127.0.10.1        # F1-C listener (SCTP 38472) for the O-DU

log:
  filename: /tmp/ocudu/cu_cp.log
  all_level: info

pcap:
  ngap_enable: true
  ngap_filename: /tmp/ocudu/cu_cp_ngap.pcap
  f1ap_enable: true
  f1ap_filename: /tmp/ocudu/cu_cp_f1ap.pcap
  e1ap_enable: true
  e1ap_filename: /tmp/ocudu/cu_cp_e1ap.pcap
