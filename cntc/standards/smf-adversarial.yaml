# CNTC requirement catalog — SMF LEVEL 2 "Adversarial Robustness & Privileged Interop"
#
# LEVEL 2 = requirements that need a NON-COMPLIANT or PRIVILEGED peer: forged/replayed/
# downgraded protocol state, deliberately malformed messages, impersonating a registered NF
# with real PKI, network-initiated/timer-driven procedures, and scale/stress edges.
#
# STATUS: ROADMAP (CNTC v2.0). These tests are NOT implemented yet — they grade 'na', so a
# Level 2 run is INCOMPLETE by design until the v2.0 tooling lands (raw N2 crafter, NF-identity
# PKI, network-side triggers). Never read an L2 'na' as a pass.
version: 0.1.0-roadmap
profile: smf-adversarial
title: "5G SMF \u2014 CNTC Level 2 (Adversarial Robustness & Privileged Interop)"
standards:
- 3GPP TS 29.502 (Nsmf)
- "3GPP TS 24.501 \xA76 (5GSM / NAS-SM)"
- 3GPP TS 29.244 (PFCP / N4)
- "3GPP TS 33.515 (SCAS \u2014 SMF)"
defaults:
  class: normal
gate:
  essential: all
tests:
- id: SMF-SESS-02
  name: "PDU session modification (24.501 \xA76.4.2)"
  category: protocol
  class: normal
  verdict: status_pass
- id: SMF-N4-02
  name: N4 session modification on PDU modify
  category: protocol
  class: normal
  verdict: status_pass
- id: SMF-NEG-02
  name: Duplicate-session handling
  category: robustness
  class: essential
  verdict: status_pass
- id: SMF-NEG-03
  name: Session-count ceiling -> graceful (no crash)
  category: robustness
  class: essential
  verdict: status_pass
