# CNTC requirement catalog: AUSF LEVEL 1 "Conformance & Observable Security"
#
# LEVEL 1 = every requirement provable by driving the NF with a SPEC-COMPLIANT peer and
# observing the result (including on-the-wire capture). No forged, replayed or malformed
# protocol state; no privileged/registered-NF identity. Level 2 (ausf-adversarial.yaml)
# covers those.
#
# Every test in this catalog is IMPLEMENTED, so an NF here is always cleanly judged
# PASS or FAIL: never INCOMPLETE because the tester didn't build something.
# Gate: all ESSENTIAL tests must PASS -> certificate. essential FAIL -> no certificate.
# A test that cannot be judged on a given deployment (e.g. needs a privileged identity) is
# kept NORMAL class so it informs the scorecard without gating.
version: 1.0.0
profile: ausf-conformance
title: "5G AUSF, CNTC Level 1 (Conformance & Observable Security)"
standards:
- 3GPP TS 29.509 (Nausf)
- 3GPP TS 33.501 (5G-AKA / EAP-AKA')
- "3GPP TS 33.516 (SCAS, AUSF)"
defaults:
  class: normal
gate:
  essential: all
tests:
- id: AUSF-AUTH-01
  name: UEAuthentication_Authenticate initiate (5G-AKA)
  category: protocol
  class: essential
  verdict: status_pass
- id: AUSF-AUTH-02
  name: "Confirm RES*, successful authentication"
  category: protocol
  class: normal
  verdict: status_pass
- id: AUSF-SEC-02
  name: SBI (Nausf) requires TLS + valid OAuth2 token
  category: security
  class: essential
  verdict: status_pass
- id: AUSF-NEG-01
  name: Malformed auth request -> reject, no crash
  category: robustness
  class: essential
  verdict: status_pass
