# CNTC requirement catalog: AMF LEVEL 2 "Adversarial Robustness & Privileged Interop"
#
# LEVEL 2 = requirements that need a NON-COMPLIANT or PRIVILEGED peer: forged/replayed/
# downgraded protocol state, deliberately malformed messages, impersonating a registered NF
# with real PKI, network-initiated/timer-driven procedures, and scale/stress edges.
#
# STATUS: ROADMAP (CNTC v2.0). These tests are NOT implemented yet, they grade 'na', so a
# Level 2 run is INCOMPLETE by design until the v2.0 tooling lands (raw N2 crafter, NF-identity
# PKI, network-side triggers). Never read an L2 'na' as a pass.
version: 0.1.0-roadmap
profile: amf-adversarial
title: "5G AMF \u2014 CNTC Level 2 (Adversarial Robustness & Privileged Interop)"
standards:
- 3GPP TS 24.501 (5GS NAS)
- 3GPP TS 38.413 (NGAP / N2)
- 3GPP TS 33.501 (5G security / 5G-AKA)
- "3GPP TS 33.512 (SCAS \u2014 AMF)"
defaults:
  class: normal
gate:
  essential: all
tests:
- id: AMF-REG-02
  name: "Periodic / mobility registration update (24.501 \xA75.5.1.3)"
  category: protocol
  class: normal
  verdict: status_pass
- id: AMF-CONN-01
  name: "Service request (24.501 \xA75.6.1)"
  category: protocol
  class: normal
  verdict: status_pass
- id: AMF-CONN-02
  name: UE context release / CM-state transition
  category: protocol
  class: normal
  verdict: status_pass
- id: AMF-CONN-03
  name: Paging (network-initiated)
  category: protocol
  class: normal
  verdict: status_pass
- id: AMF-DEREG-02
  name: "Network-initiated deregistration (24.501 \xA75.5.2.3)"
  category: protocol
  class: normal
  verdict: status_pass
- id: AMF-NGAP-05
  name: "Error indication / unknown-IE handling (38.413 \xA78.7.5)"
  category: protocol
  class: essential
  verdict: status_pass
- id: AMF-SEC-03
  name: NAS replay protection (replayed NAS rejected)
  category: security
  class: essential
  verdict: status_pass
- id: AMF-SEC-05
  name: No bidding-down (algorithm downgrade rejected)
  category: security
  class: essential
  verdict: status_pass
- id: AMF-NEG-02
  name: Invalid / malformed NAS -> reject, no crash
  category: robustness
  class: essential
  verdict: status_pass
- id: AMF-NEG-03
  name: Unknown gNB / bad NG-Setup -> reject
  category: robustness
  class: essential
  verdict: status_pass
