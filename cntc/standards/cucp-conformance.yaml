# --- Security assurance (TS 33.523 §5.2.2.1, inheriting TS 33.511 §4.2.2.1) -------------
- id: CUCP-SEC-01
  name: "RRC integrity protection after AS SMC (33.511 §4.2.2.1.1)"
  category: security
  class: essential
  verdict: status_pass
- id: CUCP-SEC-02
