  class: normal
  verdict: status_pass
- id: CUCP-SEC-05
  name: "F1-C / E1 transport protection, IPsec or DTLS (33.523 §5.2.2.1.2 / §5.2.2.1.3)"
  category: security
  class: normal
  verdict: status_pass
- id: CUCP-SEC-06
  name: "N2 transport protection, IPsec or DTLS (33.511 §4.2.2.1.16 / §4.2.2.1.17)"
  category: security
  class: normal
  verdict: status_pass
# --- Robustness ------------------------------------------------------------------------
  # The CU-CP is the only split-gNB product that listens on SCTP (F1-C 38472, E1 38462), so it
  # is the one that can be probed with malformed input by a compliant-but-crude peer.
- id: CUCP-NEG-01
  name: "Malformed input on the F1-C / E1 SCTP listener -> reject, no CU-CP crash"
  category: robustness
  class: essential
  verdict: status_pass
- id: CUCP-NEG-02
  name: "Unknown / unsupported F1AP procedure -> Error Indication, no crash (38.473 §8.2.2)"
  category: robustness
  class: normal
  verdict: status_pass
