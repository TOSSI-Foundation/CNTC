# CNTC requirement catalog: O-CU-CP LEVEL 1 "Conformance & Observable Security"
#
# Product class: gNB-CU-CP (3GPP TS 33.523 clause 5). The CU-CP terminates N2/NGAP toward the
# AMF, F1-C toward the O-DU, E1 toward the O-CU-UP, and hosts RRC.
#
# LEVEL 1 = every requirement provable by driving the target with SPEC-COMPLIANT peers (a real
# AMF, a real DU, a real CU-UP, a real UE) and observing the result, including on-the-wire
# capture. No forged, replayed or downgraded protocol state and no privileged identity, those
# are Level 2 (cucp-adversarial.yaml).
#
# Observation note: in a split gNB every RRC message crosses F1 inside an F1AP RRC container
# (TS 38.473 clause 8.4), so RRC conformance and AS-security activation are observable on the
# F1-C link without any radio decoding.
#
# Gate: all ESSENTIAL tests must PASS -> certificate. An essential FAIL -> no certificate. A test
# that cannot be judged on a deployment is 'na' -> INCOMPLETE, never a silent pass.
version: 1.0.0
profile: cucp-conformance
title: "O-CU-CP (gNB-CU-CP), CNTC Level 1 (Conformance & Observable Security)"
standards:
- 3GPP TS 38.413 (NGAP / N2)
- 3GPP TS 38.473 (F1AP / F1-C)
- 3GPP TS 38.463 (E1AP / E1)
- 3GPP TS 38.331 (NR RRC)
- 3GPP TS 33.501 (5G security)
- "3GPP TS 33.511 (SCAS, gNB)"
- "3GPP TS 33.523 (SCAS, split gNB)"
defaults:
  class: normal
gate:
  essential: all
tests:
# --- NGAP / N2 (TS 38.413) -------------------------------------------------------------
- id: CUCP-NGAP-01
  name: "NG Setup Request -> NG Setup Response (38.413 §8.7.1)"
  category: protocol
  class: essential
  verdict: status_pass
- id: CUCP-NGAP-02
  name: "Initial UE Message carries the UE NAS + RAN UE NGAP ID (38.413 §8.6.1)"
  category: protocol
  class: essential
  verdict: status_pass
- id: CUCP-NGAP-03
  name: "Initial Context Setup Request -> Response (38.413 §8.3.1)"
  category: protocol
  class: essential
  verdict: status_pass
- id: CUCP-NGAP-04
  name: "PDU Session Resource Setup -> Response with DL NG-U TNL info (38.413 §8.2.1)"
  category: protocol
  class: essential
  verdict: status_pass
- id: CUCP-NGAP-05
  name: "UL / DL NAS Transport carries NAS transparently (38.413 §8.6.2 / §8.6.3)"
  category: protocol
  class: normal
  verdict: status_pass
- id: CUCP-NGAP-06
  name: "UE Context Release Command -> Complete (38.413 §8.3.3)"
  category: protocol
  class: normal
  verdict: status_pass
- id: CUCP-NGAP-07
  name: "PDU Session Resource Release Command -> Response (38.413 §8.2.2)"
  category: protocol
  class: normal
  verdict: status_pass
- id: CUCP-NGAP-08
  name: "NG association recovery after AMF restart (38.413 §8.7.1 / TS 38.412)"
  category: robustness
  class: essential
  verdict: status_pass
# --- F1AP / F1-C, CU side (TS 38.473) --------------------------------------------------
