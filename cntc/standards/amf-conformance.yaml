# CNTC requirement catalog: AMF LEVEL 1 "Conformance & Observable Security"
#
# LEVEL 1 = every requirement provable by driving the NF with a SPEC-COMPLIANT peer and
# observing the result (including on-the-wire capture). No forged, replayed or malformed
# protocol state; no privileged/registered-NF identity. Level 2 (amf-adversarial.yaml)
# covers those.
#
# Every test in this catalog is IMPLEMENTED, so an NF here is always cleanly judged
# PASS or FAIL: never INCOMPLETE because the tester didn't build something.
# Gate: all ESSENTIAL tests must PASS -> certificate. essential FAIL -> no certificate.
# A test that cannot be judged on a given deployment (e.g. needs a privileged identity) is
# kept NORMAL class so it informs the scorecard without gating.
version: 1.0.0
profile: amf-conformance
title: "5G AMF, CNTC Level 1 (Conformance & Observable Security)"
standards:
- 3GPP TS 24.501 (5GS NAS)
- 3GPP TS 38.413 (NGAP / N2)
- 3GPP TS 33.501 (5G security / 5G-AKA)
- "3GPP TS 33.512 (SCAS, AMF)"
defaults:
  class: normal
gate:
  essential: all
tests:
- id: AMF-REG-01
  name: "Initial registration (24.501 \xA75.5.1.2)"
  category: protocol
  class: essential
  verdict: status_pass
- id: AMF-AUTH-01
  name: "5G-AKA authentication (33.501 \xA76.1.3.2)"
  category: protocol
  class: essential
  verdict: status_pass
- id: AMF-AUTH-02
  name: "Security-mode command / complete (24.501 \xA75.4.2)"
  category: protocol
  class: essential
  verdict: status_pass
- id: AMF-DEREG-01
  name: "UE-initiated deregistration (24.501 \xA75.5.2.2)"
  category: protocol
  class: essential
  verdict: status_pass
- id: AMF-NGAP-01
  name: "NG Setup, gNB\u2194AMF association (38.413 \xA78.7)"
  category: protocol
  class: essential
  verdict: status_pass
- id: AMF-NGAP-02
  name: "Initial UE message / UL-DL NAS transport (38.413 \xA78.6)"
  category: protocol
  class: normal
  verdict: status_pass
- id: AMF-NGAP-03
  name: "Initial context setup (38.413 \xA78.3)"
  category: protocol
  class: normal
  verdict: status_pass
- id: AMF-NGAP-04
  name: "UE context release (38.413 \xA78.3)"
  category: protocol
  class: normal
  verdict: status_pass
- id: AMF-SEC-01
  name: NAS integrity protection after security activation (no cleartext NAS)
  category: security
  class: essential
  verdict: status_pass
- id: AMF-SEC-02
  name: NAS confidentiality (ciphering) after SMC
  category: security
  class: essential
  verdict: status_pass
- id: AMF-SEC-04
  name: RES* verification failure -> registration rejected (no auth bypass)
  category: security
  class: essential
  verdict: status_pass
- id: AMF-SEC-06
  name: SUPI confidentiality (SUCI used; SUPI not sent in cleartext)
  category: security
  class: normal
  verdict: status_pass
- id: AMF-SEC-07
  name: SBI (Namf) requires TLS + valid OAuth2 token
  category: security
  class: normal
  verdict: status_pass
- id: AMF-NEG-01
  name: Malformed NGAP PDU -> reject, no AMF crash
  category: robustness
  class: essential
  verdict: status_pass
