# CNTC requirement catalog — AMF CONFORMANCE profile  (Stage 2, control plane)
# Per-NF, standard-anchored. Every test maps to a clause of the AMF's own 3GPP specs:
#   protocol : TS 24.501 (NAS), TS 38.413 (NGAP), TS 29.518 (Namf), TS 33.501 (5G-AKA)
#   security : TS 33.512 (SCAS — AMF), the protocol-facing subset only
#
# Grading rule (same as the UPF conformance profile): every ESSENTIAL test must PASS -> PASS.
#   essential FAIL -> FAIL ; essential not-run/errored/unobservable -> 'na' -> INCOMPLETE.
# 'na' is NEVER silently promoted to pass. SCAS hardening/lifecycle-audit cases (OS hardening,
# default creds, secure boot) are OUT OF SCOPE for this open harness — they are not listed here
# rather than listed and faked.
version: "0.1.0"
profile: amf-conformance
title: "5G AMF Conformance (NAS / NGAP / SCAS)"
standards:
  - "3GPP TS 24.501 (5GS NAS)"
  - "3GPP TS 38.413 (NGAP / N2)"
  - "3GPP TS 33.501 (5G security / 5G-AKA)"
  - "3GPP TS 33.512 (SCAS — AMF)"
defaults:
  class: normal
gate:
  essential: all

tests:
  # --- protocol: registration / connection management (TS 24.501) --------------------
  - id: AMF-REG-01
    name: Initial registration (24.501 §5.5.1.2)
    category: protocol
    class: essential
    verdict: status_pass
  - id: AMF-REG-02
    name: Periodic / mobility registration update (24.501 §5.5.1.3)
    category: protocol
    class: normal
    verdict: status_pass
  - id: AMF-AUTH-01
    name: 5G-AKA authentication (33.501 §6.1.3.2)
    category: protocol
    class: essential
    verdict: status_pass
  - id: AMF-AUTH-02
    name: Security-mode command / complete (24.501 §5.4.2)
    category: protocol
    class: essential
    verdict: status_pass
  - id: AMF-CONN-01
    name: Service request (24.501 §5.6.1)
    category: protocol
    class: normal
    verdict: status_pass
  - id: AMF-CONN-02
    name: UE context release / CM-state transition
    category: protocol
    class: normal
    verdict: status_pass
  - id: AMF-CONN-03
    name: Paging (network-initiated)
    category: protocol
    class: normal
    verdict: status_pass
  - id: AMF-DEREG-01
    name: UE-initiated deregistration (24.501 §5.5.2.2)
    category: protocol
    class: essential
    verdict: status_pass
  - id: AMF-DEREG-02
    name: Network-initiated deregistration (24.501 §5.5.2.3)
    category: protocol
    class: normal
    verdict: status_pass

  # --- protocol: NGAP / N2 (TS 38.413) ----------------------------------------------
  - id: AMF-NGAP-01
    name: NG Setup — gNB↔AMF association (38.413 §8.7)
    category: protocol
    class: essential
    verdict: status_pass
  - id: AMF-NGAP-02
    name: Initial UE message / UL-DL NAS transport (38.413 §8.6)
    category: protocol
    class: normal
    verdict: status_pass
  - id: AMF-NGAP-03
    name: Initial context setup (38.413 §8.3)
    category: protocol
    class: normal
    verdict: status_pass
  - id: AMF-NGAP-04
    name: UE context release (38.413 §8.3)
    category: protocol
    class: normal
    verdict: status_pass
  - id: AMF-NGAP-05
    name: Error indication / unknown-IE handling (38.413 §8.7.5)
    category: protocol
    class: normal
    verdict: status_pass

  # --- security assurance: protocol-facing SCAS cases (TS 33.512) --------------------
  - id: AMF-SEC-01
    name: NAS integrity protection after security activation (no cleartext NAS)
    category: security
    class: essential
    verdict: status_pass
  - id: AMF-SEC-02
    name: NAS confidentiality (ciphering) after SMC
    category: security
    class: essential
    verdict: status_pass
  - id: AMF-SEC-03
    name: NAS replay protection (replayed NAS rejected)
    category: security
    class: normal
    verdict: status_pass
  - id: AMF-SEC-04
    name: RES* verification failure -> registration rejected (no auth bypass)
    category: security
    class: essential
    verdict: status_pass
  - id: AMF-SEC-05
    name: No bidding-down (algorithm downgrade rejected)
    category: security
    class: normal
    verdict: status_pass
  - id: AMF-SEC-06
    name: SUPI confidentiality (SUCI used; SUPI not sent in cleartext)
    category: security
    class: normal
    verdict: status_pass
  - id: AMF-SEC-07
    name: SBI (Namf) requires TLS + valid OAuth2 token
    category: security
    class: normal
    verdict: status_pass

  # --- robustness (a crash on malformed signaling = a control-plane DoS) -------------
  - id: AMF-NEG-01
    name: Malformed NGAP PDU -> reject, no AMF crash
    category: robustness
    class: essential
    verdict: status_pass
  - id: AMF-NEG-02
    name: Invalid / malformed NAS -> reject, no crash
    category: robustness
    class: normal
    verdict: status_pass
  - id: AMF-NEG-03
    name: Unknown gNB / bad NG-Setup -> reject
    category: robustness
    class: normal
    verdict: status_pass
